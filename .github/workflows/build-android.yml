name: Build Android APK

on:
  push:
    paths:
      - "native/android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CryptoConex.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoConex-Android-APK
          path: native/android/app/build/outputs/apk/debug/*.apk

      - name: Publish to GitHub Release (Android)
        # main is stale (Save to GitHub pushes to another branch): only publish from fresh pushes / other branches
        if: github.event_name == 'push' || github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Crypto Conex Android (última versão)
          make_latest: false
          files: native/android/app/build/outputs/apk/debug/CryptoConex.apk
