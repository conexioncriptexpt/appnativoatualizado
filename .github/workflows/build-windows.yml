name: Build Windows EXE

on:
  push:
    paths:
      - "native/windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish single-file EXE
        run: dotnet publish CryptoConexPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CryptoConex-Windows-EXE
          path: native/windows/publish/CryptoConexPC.exe

      - name: Publish to GitHub Release (Windows)
        # main is stale (Save to GitHub pushes to another branch): only publish from fresh pushes / other branches
        if: github.event_name == 'push' || github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Crypto Conex Windows (última versão)
          make_latest: false
          files: native/windows/publish/CryptoConexPC.exe
